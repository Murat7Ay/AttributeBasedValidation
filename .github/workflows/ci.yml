name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Conform.slnx -c Release

  # Push a tag such as v0.1.0 or v0.1.0-preview.1 to publish that version.
  # Requires the repository secret NUGET_API_KEY (nuget.org → API Keys, scope: push, glob: Conform.Net*).
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack src/Conform/Conform.csproj -c Release -o out -p:Version="$VERSION"
          dotnet pack src/Conform.Annotations/Conform.Annotations.csproj -c Release -o out -p:Version="$VERSION"
      - name: Push to nuget.org
        run: dotnet nuget push "out/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
