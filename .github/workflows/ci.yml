name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Conform.slnx -c Release

  # Push a tag such as v0.1.0 or v0.1.0-preview.1 to publish that version.
  # Uses nuget.org Trusted Publishing (OIDC): no long-lived API key is stored anywhere.
  # Setup: nuget.org → Trusted Publishing policy (owner Murat7Ay, repo AttributeBasedValidation,
  # workflow file ci.yml), and the repository secret NUGET_USER = your nuget.org profile name (not e-mail).
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets the job request a GitHub OIDC token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack src/Conform/Conform.csproj -c Release -o out -p:Version="$VERSION"
          dotnet pack src/Conform.Annotations/Conform.Annotations.csproj -c Release -o out -p:Version="$VERSION"
      # Exchange the OIDC token for a temporary (1 hour) API key right before pushing.
      - name: NuGet login (OIDC → temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org
        run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
